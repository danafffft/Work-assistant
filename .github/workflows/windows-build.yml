name: Windows tests and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'web/**'
      - 'requirements-windows.txt'
      - 'packaging/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows.txt pyinstaller==6.16.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name WorkAssistant --add-data "web;web" --collect-all webview --collect-all msal --hidden-import win32com.client --hidden-import pythoncom desktop.py
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing on runner' }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: WorkAssistant-Windows-unsigned
          path: |
            dist/WorkAssistant/
            installer-output/*.exe
          if-no-files-found: error
          retention-days: 7
